<html lang="en">

<head>

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- PWA primary color -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BizFlow">
    <link rel="manifest" href="/manifest.webmanifest">

    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png">

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">

    <!-- Open Graph (WhatsApp, Facebook, etc) -->

    <meta property="og:title" content="BizFlow Ledger">
    <meta property="og:description" content="Premium business management and financial analytics platform.">
    <meta property="og:image" content="/icons/icon-512x512.png">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BizFlow Ledger">
    <meta name="twitter:description" content="Premium business management and financial analytics platform.">
    <meta name="twitter:image" content="/icons/icon-512x512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        blob: "blob 7s infinite",
                        'slide-in-from-bottom-2': 'slideInFromBottom2 0.5s ease-out forwards',
                        'slide-in-from-bottom-4': 'slideInFromBottom4 0.7s ease-out forwards',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'zoom-in-95': 'zoomIn95 0.5s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            "0%": {
                                transform: "translate(0px, 0px) scale(1)",
                            },
                            "33%": {
                                transform: "translate(30px, -50px) scale(1.1)",
                            },
                            "66%": {
                                transform: "translate(-20px, 20px) scale(0.9)",
                            },
                            "100%": {
                                transform: "translate(0px, 0px) scale(1)",
                            },
                        },
                        slideInFromBottom2: {
                            "0%": { transform: "translateY(0.5rem)", opacity: 0 },
                            "100%": { transform: "translateY(0)", opacity: 1 },
                        },
                        slideInFromBottom4: {
                            "0%": { transform: "translateY(1rem)", opacity: 0 },
                            "100%": { transform: "translateY(0)", opacity: 1 },
                        },
                        fadeIn: {
                            "0%": { opacity: 0 },
                            "100%": { opacity: 1 },
                        },
                        zoomIn95: {
                            "0%": { transform: "scale(0.95)", opacity: 0 },
                            "100%": { transform: "scale(1)", opacity: 1 },
                        }
                    },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        .pb-safe-area {
            padding-bottom: env(safe-area-inset-bottom);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script type="importmap">
{
  "imports": {

    "firebase/firestore": "https://esm.sh/firebase@11.1.0/firestore",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.8.0/"
  }
}
</script>

</head>
