    <script src="https://cdn.tailwindcss.com"></script>

                    slate: {50:'#FAF9F5',100:'#F0EEE6',200:'#E8E6DC',300:'#D1CFC5',400:'#B0AEA5',500:'#87867F',600:'#5E5D59',700:'#3D3D3A',800:'#262624',900:'#141413',950:'#0D0D0C'},

                    teal: {50:'#EFF5F3',100:'#DCEAE6',200:'#BCD4CE',400:'#7FA89F',500:'#5E8C82',600:'#4A726A',700:'#3B5B55'},
                    cyan: {50:'#EFF5F3',100:'#DCEAE6',400:'#7FA89F',500:'#5E8C82',600:'#4A726A'},
                    rose: {50:'#FBF0ED',100:'#F5DDD7',200:'#EBBFB5',300:'#DE9C8F',400:'#CF7967',500:'#BF5A48',600:'#A64739',700:'#88382D',800:'#6C2D25',900:'#52231D'},

                    sky: {50:'#F0F4F8',100:'#E0E8F0',400:'#7F9BB8',500:'#6283A6',600:'#4D6C8C'},
                },
                fontFamily: { serif: ['Newsreader','Georgia','serif'] },
                    animation: {
                        blob: "blob 7s infinite",
                        'slide-in-from-bottom-2': 'slideInFromBottom2 0.5s ease-out forwards',
                        'slide-in-from-bottom-4': 'slideInFromBottom4 0.7s ease-out forwards',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'zoom-in-95': 'zoomIn95 0.5s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            "0%": {
                                transform: "translate(0px, 0px) scale(1)",
                            },
                            "33%": {
                                transform: "translate(30px, -50px) scale(1.1)",
                            },
                            "66%": {
                                transform: "translate(-20px, 20px) scale(0.9)",
                            },
                            "100%": {
                                transform: "translate(0px, 0px) scale(1)",
                            },
                        },
                        slideInFromBottom2: {
                            "0%": { transform: "translateY(0.5rem)", opacity: 0 },
                            "100%": { transform: "translateY(0)", opacity: 1 },
                        },
                        slideInFromBottom4: {
                            "0%": { transform: "translateY(1rem)", opacity: 0 },
                            "100%": { transform: "translateY(0)", opacity: 1 },
                        },
                        fadeIn: {
                            "0%": { opacity: 0 },
                            "100%": { opacity: 1 },
                        },
                        zoomIn95: {
                            "0%": { transform: "scale(0.95)", opacity: 0 },
                            "100%": { transform: "scale(1)", opacity: 1 },
                        }
                    },
                },
            },
        }

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F4ED;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; letter-spacing: -0.01em; }
        /* calmer weights: no ultra-heavy text */
        .font-black { font-weight: 700 !important; }
        .font-extrabold { font-weight: 650 !important; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(217, 119, 87, 0.4);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #E0DDD2;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #C9C6BA;
        }

        .pb-safe-area {
            padding-bottom: env(safe-area-inset-bottom);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
